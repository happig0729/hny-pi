  /ai/classify/batch:
    post:
      operationId: aiClassifyFilesBatch
      tags: [ai]
      summary: AI批量文件分类
      description: 批量使用AI识别文件类型（单次最多10个文件）
      requestBody:
        required: true
        content:
          application/json:
