openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: 青岛工程档案管理平台 API
servers:
  - url: /api/v1
    description: Versioned API path

security:
  - BearerAuth: []

tags:
  - name: health
    description: Health operations
  - name: metrics
    description: Prometheus 指标
  - name: projects
    description: 项目管理
  - name: units
    description: 单位工程管理
  - name: documents
    description: 资料编制
  - name: reviews
    description: 审核流程
  - name: archives
    description: 档案管理
  - name: users
    description: 用户管理
  - name: templates
    description: 模板管理
  - name: auth
    description: 认证与授权
  - name: seals
    description: 印章认证
  - name: tenants
    description: 租户管理（SaaS）
  - name: system
    description: 系统管理
  - name: ai
    description: AI 助手
  - name: form-fill
    description: 智能表单填充
  - name: compliance-precheck
    description: 归档合规预检
  - name: api-keys
    description: API Key 管理
  - name: wechat
    description: 微信小程序登录
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /metrics:
    get:
      operationId: getMetrics
      tags: [metrics]
      summary: 获取 Prometheus 指标
      description: 返回 Prometheus text exposition 格式的运行指标，供监控系统抓取。
      responses:
        "200":
          description: Prometheus 指标文本
          content:
            text/plain:
              schema:
                type: string

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: 获取项目列表
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived, completed]
        - name: keyword
          in: query
          description: 支持按项目名称或编号模糊搜索
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: 项目列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
    post:
      operationId: createProject
      tags: [projects]
      summary: 创建项目
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: 项目创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: 获取项目详情
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 项目详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: 项目不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateProject
      tags: [projects]
      summary: 更新项目
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: 删除项目
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "204":
          description: 删除成功

  /projects/join:
    post:
      operationId: joinProject
      tags: [projects]
      summary: 通过接入码加入项目
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinProjectRequest"
      responses:
        "201":
          description: 加入成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinProjectResponse"
        "401":
          description: 接入密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 接入码对应的项目不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 已经是项目成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/stats:
    get:
      operationId: getProjectStats
      tags: [projects]
      summary: 获取项目统计
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 项目统计
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStats"

  /projects/{projectId}/units:
    get:
      operationId: listUnits
      tags: [units]
      summary: 获取单位工程列表
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 单位工程列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Unit"
    post:
      operationId: createUnit
      tags: [units]
      summary: 创建单位工程
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUnitRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"

  /projects/{projectId}/units/{unitId}:
    put:
      operationId: updateUnit
      tags: [units]
      summary: 更新单位工程
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: unitId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUnitRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
    delete:
      operationId: deleteUnit
      tags: [units]
      summary: 删除单位工程
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: unitId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "204":
          description: 删除成功

  /projects/{projectId}/documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: 获取资料列表
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: unitId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, under_review, approved, rejected]
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 资料列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: 创建资料
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /projects/{projectId}/documents/{documentId}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: 获取资料详情
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 资料详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    put:
      operationId: updateDocument
      tags: [documents]
      summary: 更新资料
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: 删除资料
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "204":
          description: 删除成功

  /projects/{projectId}/documents/{documentId}/submit:
    post:
      operationId: submitDocumentForReview
      tags: [documents]
      summary: 提交审核
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 提交成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
  /projects/{projectId}/instances:
    get:
      operationId: listCompilationInstances
      tags: [documents]
      summary: 获取编制实例列表
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: query
          schema:
            type: string
        - name: unitId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: 编制实例列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  message: { type: string }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompilationInstance"
                  success: { type: boolean }
    post:
      operationId: createCompilationInstance
      tags: [documents]
      summary: 创建编制实例
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompilationInstanceRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  message: { type: string }
                  data:
                    $ref: "#/components/schemas/CompilationInstance"
                  success: { type: boolean }

  /projects/{projectId}/instances/{instanceId}:
    get:
      operationId: getCompilationInstance
      tags: [documents]
      summary: 获取编制实例详情
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: instanceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 实例详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  message: { type: string }
                  data:
                    allOf:
                      - $ref: "#/components/schemas/CompilationInstance"
                      - type: object
                        properties:
                          formData:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: integer }
                                instanceId: { type: integer }
                                fieldKey: { type: string }
                                fieldValue: { type: string, nullable: true }
                  success: { type: boolean }
    put:
      operationId: updateCompilationInstance
      tags: [documents]
      summary: 更新编制实例
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: instanceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompilationInstanceRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    delete:
      operationId: deleteCompilationInstance
      tags: [documents]
      summary: 删除编制实例
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: instanceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 删除成功

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /projects/{projectId}/instances/{instanceId}/form-data:
    get:
      operationId: getCompilationFormData
      tags: [documents]
      summary: 获取表单数据
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: instanceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 表单数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    put:
      operationId: updateCompilationFormData
      tags: [documents]
      summary: 写入表单数据
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: instanceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompilationFormDataUpsertRequest"
      responses:
        "200":
          description: 更新成功

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /projects/{projectId}/instances/{instanceId}/form-data/{fieldKey}:
    delete:
      operationId: deleteCompilationFormField
      tags: [documents]
      summary: 删除表单字段
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: instanceId
          in: path
          required: true
          schema:
            type: integer
        - name: fieldKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 删除成功


          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: 获取审核任务列表
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: assignedTo
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: 审核任务列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

  /reviews/{reviewId}:
    get:
      operationId: getReview
      tags: [reviews]
      summary: 获取审核详情
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 审核详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /reviews/{reviewId}/approve:
    post:
      operationId: approveReview
      tags: [reviews]
      summary: 审核通过
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewActionRequest"
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /reviews/{reviewId}/reject:
    post:
      operationId: rejectReview
      tags: [reviews]
      summary: 审核驳回
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewActionRequest"
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /reviews/hints:
    post:
      operationId: generateReviewHints
      tags: [reviews]
      summary: 生成审核智能提示
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewHintsRequest"
      responses:
        "200":
          description: 审核提示生成成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewHintsResponse"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/archive:
    post:
      operationId: archiveProject
      tags: [archives]
      summary: 归档项目
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 归档成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveResult"

  /projects/{projectId}/package:
    post:
      operationId: packageProject
      tags: [archives]
      summary: 生成封装包
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 封装包生成成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageResult"

  /projects/{projectId}/access-code:
    get:
      operationId: getProjectAccessCode
      tags: [projects]
      summary: 获取项目接入码和密码（仅项目创建者可查看）
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 接入码信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessCodeResponse"
        "403":
          description: 仅项目创建者可查看
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 项目不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/access-code/reset:
    post:
      operationId: resetProjectAccessPassword
      tags: [projects]
      summary: 重置项目接入密码（仅项目创建者可操作）
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 重置成功，返回新接入码和密码
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessCodeResponse"
        "403":
          description: 仅项目创建者可操作
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 项目不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/members:
    get:
      operationId: listProjectMembers
      tags: [project-members]
      summary: 获取项目成员列表
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 项目成员列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    post:
      operationId: addProjectMember
      tags: [project-members]
      summary: 添加项目成员
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, role]
              properties:
                userId:
                  type: integer
                role:
                  type: string
                  enum: [project_admin, data_admin, data_clerk]
      responses:
        "201":
          description: 添加成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /projects/{projectId}/members/{memberId}:
    put:
      operationId: updateProjectMember
      tags: [project-members]
      summary: 更新项目成员角色
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [project_admin, data_admin, data_clerk]
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    delete:
      operationId: removeProjectMember
      tags: [project-members]
      summary: 移除项目成员
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 移除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "204":
          description: 移除成功

  /users:
    get:
      operationId: listUsers
