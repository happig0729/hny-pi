  /ai/classify/file-types:
    get:
      operationId: aiGetFileTypes
      tags: [ai]
      summary: 获取支持的文件类型列表
      description: 返回AI分类支持的文件类型及其对应的归档目录节点
      responses:
        "200":
          description: 文件类型列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiFileTypesResponse"

  /form-fill/project/{projectId}/defaults:
    get:
      operationId: getFormFillDefaults
      tags: [form-fill]
      summary: 获取项目默认填充值
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 项目默认填充值
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormFillDefaultsResponse"

  /form-fill/suggest:
    post:
      operationId: getFormFillSuggestions
      tags: [form-fill]
      summary: 获取完整填充建议
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormFillSuggestRequest"
      responses:
        "200":
          description: 填充建议
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormFillSuggestionsResponse"

  /form-fill/history:
    post:
      operationId: getFormFillHistory
      tags: [form-fill]
      summary: 获取基于历史数据的填充建议
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormFillHistoryRequest"
      responses:
        "200":
          description: 历史填充建议
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormFillDefaultsResponse"

  /form-fill/infer:
    post:
      operationId: inferFormFillFields
      tags: [form-fill]
      summary: AI推断缺失字段
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormFillInferRequest"
      responses:
        "200":
          description: AI推断结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormFillInferResponse"
        "400":
          description: 未配置AI设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /form-fill/batch:
    post:
      operationId: batchFormFill
      tags: [form-fill]
      summary: 批量填充
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormFillBatchRequest"
      responses:
        "200":
          description: 批量填充结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormFillBatchResponse"

  # ── Seal Flow ──────────────────────────────────────────
  /seal-flow:
    get:
      operationId: listSealFlowTasks
      tags: [seal-flow]
      summary: 获取当前用户的签章流转任务
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 签章流转任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /seal-flow/{nodeId}/sign:
    post:
      operationId: signSealFlowNode
      tags: [seal-flow]
      summary: 执行签章
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 签章完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ── API Keys ──────────────────────────────────────────
  /api-keys:
    get:
      operationId: listApiKeys
      tags: [api-keys]
      summary: 列出当前用户的 API Key
      security:
        - BearerAuth: []
      responses:
        "200":
          description: API Key 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    keyPrefix: { type: string }
                    name: { type: string }
                    status: { type: string }
                    lastUsedAt: { type: string, format: date-time, nullable: true }
                    expiresAt: { type: string, format: date-time, nullable: true }
                    createdAt: { type: string, format: date-time }
    post:
      operationId: createApiKey
      tags: [api-keys]
      summary: 创建 API Key
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                expiresAt: { type: string, format: date-time }
      responses:
        "201":
          description: 创建成功（raw key 仅返回一次）
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string, description: "完整 API Key（qd_live_ 前缀）" }
                  keyPrefix: { type: string }
                  name: { type: string }

  /api-keys/{keyId}:
    delete:
      operationId: revokeApiKey
      tags: [api-keys]
      summary: 撤销 API Key
      security:
        - BearerAuth: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: 撤销结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  # ── WeChat ──────────────────────────────────────────
  /wechat/login:
    post:
      operationId: wechatLogin
      tags: [wechat]
      summary: 微信小程序登录（code 换 JWT）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: "wx.login() 获取的 code" }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  user:
                    type: object
                    properties:
                      id: { type: integer }
                      username: { type: string }
                      role: { type: string }
        "401":
          description: 微信登录失败或未绑定

  /wechat/bind:
    post:
      operationId: wechatBind
      tags: [wechat]
      summary: 绑定微信账号到当前用户
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openid]
              properties:
                openid: { type: string }
                unionid: { type: string }
                nickname: { type: string }
      responses:
        "200":
          description: 绑定结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
    delete:
      operationId: wechatUnbind
      tags: [wechat]
      summary: 解绑微信账号
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openid]
              properties:
                openid: { type: string }
      responses:
        "200":
          description: 解绑结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /wechat/bindings:
    get:
      operationId: listWechatBindings
      tags: [wechat]
      summary: 查看当前用户的微信绑定
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 绑定列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    openid: { type: string }
                    nickname: { type: string, nullable: true }
                    createdAt: { type: string, format: date-time }

  /user/preferences:
    get:
      operationId: getUserPreference
      tags: [user-preferences]
      summary: 获取当前用户偏好
      security:
        - BearerAuth: []
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 偏好值
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
                  value: { type: object }
    put:
      operationId: upsertUserPreference
      tags: [user-preferences]
      summary: 设置当前用户偏好
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: { type: string }
                value: { type: object }
              required:
                - key
                - value
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
                  value: { type: object }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Access Token（通过 /auth/login 获取）
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: API Key（qd_live_ 前缀，通过 /api-keys 创建）

  schemas:
    InvitePreviewResponse:
      type: object
      properties:
        valid:
          type: boolean
        projectName:
          type: string
        role:
          type: string
        inviteRemark:
          type: string
    AcceptInviteResponse:
      type: object
      properties:
        projectId:
          type: integer
        projectName:
          type: string
        role:
          type: string
        alreadyMember:
          type: boolean
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DictionaryItem:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required:
        - code
        - name

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
        type:
          type: string
          description: 项目类型（住宅、商业、市政等）
        status:
          type: string
          enum: [active, project_archive]
        buildingUnit:
          type: string
          description: 建设单位
        constructionUnit:
          type: string
          description: 施工单位
        supervisionUnit:
          type: string
          description: 监理单位
        designUnit:
          type: string
          description: 设计单位
        location:
          type: string
          description: 建设地址
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        totalArea:
          type: number
          description: 总建筑面积（㎡）
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        unitCount:
          type: integer
        documentCount:
          type: integer
        pendingReviewCount:
          type: integer
      required:
        - id
        - name
        - status
        - createdAt
        - updatedAt

    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        type:
          type: string
        buildingUnit:
          type: string
        constructionUnit:
          type: string
        supervisionUnit:
          type: string
        designUnit:
          type: string
        location:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        totalArea:
          type: number
        description:
          type: string
      required:
        - name
        - type
        - buildingUnit

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        type:
          type: string
        status:
          type: string
          enum: [active, project_archive]
        buildingUnit:
          type: string
        constructionUnit:
          type: string
        supervisionUnit:
          type: string
        designUnit:
          type: string
        location:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        totalArea:
          type: number
        description:
          type: string

    ProjectListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - data
        - total
        - page
        - limit

    ProjectStats:
      type: object
      properties:
        totalDocuments:
          type: integer
        approvedDocuments:
          type: integer
        pendingReviews:
          type: integer
        totalUnits:
          type: integer
      required:
        - totalDocuments
        - approvedDocuments
        - pendingReviews
        - totalUnits

    JoinProjectRequest:
      type: object
      properties:
        accessCode:
          type: string
          description: 项目接入码
        accessPassword:
          type: string
          description: 接入密码
        name:
          type: string
          description: 成员姓名
        role:
          type: string
          description: 成员角色
        unit:
          type: string
          description: 所属单位（可选）
      required:
        - accessCode
        - accessPassword
        - name
        - role

    JoinProjectResponse:
      type: object
      properties:
        projectId:
          type: integer
        projectName:
          type: string
        member:
          type: object
          properties:
            id:
              type: integer
            projectId:
              type: integer
            name:
              type: string
            role:
              type: string
            unit:
              type: string
            joinMethod:
              type: string
              enum: [access_code, invite_link]
            isOwner:
              type: boolean
            joinedAt:
              type: string
              format: date-time
      required:
        - projectId
        - projectName
        - member

    AccessCodeResponse:
      type: object
      properties:
        accessCode:
          type: string
          description: 工程接入码
        accessPassword:
          type: string
          description: 访问密码
      required:
        - accessCode
        - accessPassword

    Unit:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        engType:
          type: string
          description: 工程类型（D.0.2 code）
        structureType:
          type: string
          description: 结构类型
        floors:
          type: integer
          description: 层数
        buildingArea:
          type: number
          description: 建筑面积（㎡）
        documentCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - name
        - createdAt

    UploadFile:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        unitId:
          type: integer
        fileName:
          type: string
        title:
          type: string
        fileType:
          type: string
          description: 文件类型业务标签 PDF/OFD/其他
        mimeType:
          type: string
        fileSize:
          type: integer
        fileUrl:
          type: string
        storagePath:
          type: string
        nodeId:
          type: string
        nodeLabel:
          type: string
        carrier:
          type: string
        compiler:
          type: string
        compileDate:
          type: string
          format: date
        responsible:
          type: string
        copies:
          type: integer
        pages:
          type: integer
        remarks:
          type: string
        status:
          type: string
          enum: [pending, signing, signed, collected, returned]
        uploadedBy:
          type: integer
        uploadedAt:
          type: string
          format: date-time
        cataloguedBy:
          type: integer
        cataloguedAt:
          type: string
          format: date-time
        returnReason:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - fileName
        - status
        - uploadedAt

    UploadFileVersion:
      type: object
      properties:
        id:
          type: integer
        uploadFileId:
          type: integer
        version:
          type: integer
        fileUrl:
          type: string
        storagePath:
          type: string
        fileSize:
          type: integer
        mimeType:
          type: string
        titleSnapshot:
          type: string
        fileNameSnapshot:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: integer

    CreateUnitRequest:
      type: object
      properties:
        name:
          type: string
        engType:
          type: string
          description: 工程类型（D.0.2 code）
        structureType:
          type: string
        floors:
          type: integer
        buildingArea:
          type: number
      required:
        - name

    Document:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        unitId:
          type: integer
        title:
          type: string
        code:
          type: string
          description: 资料编号
        category:
          type: string
          description: 资料分类
        subCategory:
          type: string
        type:
          type: string
          enum: [online, uploaded]
          description: online=在线编制, uploaded=外部上传
        status:
          type: string
          enum: [draft, under_review, approved, rejected]
        content:
          type: string
          description: 在线编制内容（JSON格式）
        fileUrl:
          type: string
          description: 上传文件URL
        fileFormat:
          type: string
        version:
          type: integer
        createdBy:
          type: integer
        assignedReviewer:
          type: integer
        reviewComment:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - title
        - category
        - type
        - status
        - createdAt
        - updatedAt

    CreateDocumentRequest:
      type: object
      properties:
        unitId:
          type: integer
        title:
          type: string
        code:
          type: string
        category:
          type: string
        subCategory:
          type: string
        type:
          type: string
          enum: [online, uploaded]
        templateId:
          type: integer
        content:
          type: string
        fileUrl:
          type: string
        fileFormat:
          type: string
      required:
        - title
        - category
        - type

    UpdateDocumentRequest:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        fileUrl:
          type: string
        status:
          type: string
          enum: [draft, under_review, approved, rejected]

    Review:
      type: object
      properties:
        id:
          type: integer
        documentId:
          type: integer
        documentTitle:
          type: string
        projectId:
          type: integer
        projectName:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        assignedTo:
          type: integer
        assignedToName:
          type: string
        submittedBy:
          type: integer
        submittedByName:
          type: string
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - documentId
        - status
        - createdAt
        - updatedAt

    ReviewActionRequest:
      type: object
      properties:
        comment:
          type: string
      required:
        - comment

    ReviewHintsRequest:
      type: object
      properties:
        documentId:
          type: integer
        projectId:
          type: integer
        content:
          type: string
      required:
        - documentId
        - projectId

    ReviewHint:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [risk, compliance, suggestion]
        severity:
          type: string
          enum: [high, medium, low]
        title:
          type: string
        description:
          type: string
        field:
          type: string
        suggestion:
          type: string
      required:
        - id
        - type
        - severity
        - title
        - description

    ReviewHintsResult:
      type: object
      properties:
        documentId:
          type: integer
        hints:
          type: array
          items:
            $ref: "#/components/schemas/ReviewHint"
        summary:
          type: object
          properties:
            riskCount:
              type: integer
            complianceCount:
              type: integer
            suggestionCount:
              type: integer
          required:
            - riskCount
            - complianceCount
            - suggestionCount
        generatedAt:
          type: string
          format: date-time
      required:
        - documentId
        - hints
        - summary
