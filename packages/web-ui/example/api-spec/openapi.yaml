      responses:
        "200":
          description: 测试结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTestResponse"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/classify:
    post:
      operationId: aiClassifyFile
      tags: [ai]
