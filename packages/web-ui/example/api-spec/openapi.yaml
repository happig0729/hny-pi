        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiClassifyRequest"
      responses:
        "200":
          description: 分类结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiClassifyResponse"
        "400":
          description: 请求参数错误
